<meta charset="UTF-8">

<title>Ludo Board</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    font-family: Arial, sans-serif;
}

.board {
    width: 90vw;
    max-width: 600px;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);
    border: 2px solid #777;
}

/* All cells */
.cell {
    border: 1px solid #999;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    font-weight: bold;
}

/* Red area */
.red {
    background: #f20d0d;
}

/* Green area */
.green {
    background: green;
}

/* Blue area */
.blue {
    background: #78c4eb;
}

/* Yellow area */
.yellow {
    background: yellow;
}

/* White paths */
.white {
    background: white;
}

/* Center */
.center {
    background: white;
    position: relative;
}

.center::before {
    content: "";
    position: absolute;
    width: 0;
    height: 0;
    border-left: 35px solid transparent;
    border-right: 35px solid transparent;
    border-bottom: 35px solid green;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
}

.center::after {
    content: "";
    position: absolute;
    width: 0;
    height: 0;
    border-left: 35px solid transparent;
    border-right: 35px solid transparent;
    border-top: 35px solid yellow;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
}

/* Stars */
.star {
    font-size: 25px;
}

/* Start text */
.start {
    font-size: 10px;
    color: white;
}
</style>
</head>
